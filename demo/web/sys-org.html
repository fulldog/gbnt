<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>组织架构 · 高标农田专项整治平台</title>
    <link rel="icon" type="image/png" href="../media/favicon.png" />
    <link rel="stylesheet" href="../frontend/css/variables.css" />
    <link rel="stylesheet" href="../frontend/css/layout.css" />
    <link rel="stylesheet" href="../frontend/css/vben-shell.css" />
    <link rel="stylesheet" href="../frontend/css/sys-components.css" />
    <link rel="stylesheet" href="../frontend/css/sys-form.css" />
    <link rel="stylesheet" href="../frontend/css/system-admin.css" />
  </head>
  <body>
    <script>
      window.HSF_BASE = '../';
      window.HSF_VBEN_DEFAULT_TAG = { title: '组织架构', path: '/web/sys-org.html' };
    </script>
    <div class="app-container sys-admin-scope">
      <vben-sidebar></vben-sidebar>
      <div class="main-wrapper">
        <vben-header></vben-header>
        <div class="content-container">
          <div id="sys-admin-root" data-module="sysOrg"></div>
        </div>
        <vben-footer></vben-footer>
      </div>
    </div>

    <div class="v52-modal-overlay" id="modalBranchEdit" onclick="if(event.target===this)closeModal('modalBranchEdit')">
      <div class="v52-modal-box" style="width:520px;max-width:96vw;">
        <div class="v52-modal-header">
          <div class="v52-modal-title" id="modalBranchEditTitle">新增单位</div>
          <div class="v52-header-ops">
            <div class="v52-op-icon" onclick="closeModal('modalBranchEdit')" title="关闭">
              <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </div>
          </div>
        </div>
        <div class="v52-modal-body">
          <form id="formBranchEdit" class="crm-form-section" onsubmit="return false;">
            <div class="form-group" id="branchEditParentGroup">
              <label class="form-label"><span class="required">*</span>上级单位</label>
              <select class="form-control" id="branchEditParent"></select>
            </div>
            <div class="form-group">
              <label class="form-label"><span class="required">*</span>单位名称</label>
              <input type="text" class="form-control" id="branchEditName" placeholder="请输入单位名称" maxlength="50" />
            </div>
            <div class="form-group">
              <label class="form-label" for="branchEditSort"><span class="required">*</span>排序</label>
              <input type="number" class="form-control sys-org-form-sort" id="branchEditSort" min="1" step="1" value="1" />
            </div>
            <p id="branchEditError" class="text-danger" style="display:none;margin:0;font-size:14px;"></p>
          </form>
        </div>
        <div class="v52-modal-footer">
          <button type="button" class="v52-btn-std" onclick="closeModal('modalBranchEdit')">取消</button>
          <button type="button" class="v52-btn-primary" id="branchEditSaveBtn">保存</button>
        </div>
      </div>
    </div>

    <div class="v52-modal-overlay" id="modalBranchConfirm" onclick="if(event.target===this)closeModal('modalBranchConfirm')">
      <div class="v52-modal-box" style="width:420px;max-width:96vw;">
        <div class="v52-modal-header">
          <div class="v52-modal-title">操作确认</div>
          <div class="v52-header-ops">
            <div class="v52-op-icon" onclick="closeModal('modalBranchConfirm')" title="关闭">
              <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </div>
          </div>
        </div>
        <div class="v52-modal-body">
          <p id="modalBranchConfirmMsg" style="margin:0;font-size:14px;color:#666;line-height:1.6;">确认删除该单位吗？</p>
        </div>
        <div class="v52-modal-footer">
          <button type="button" class="v52-btn-std" onclick="closeModal('modalBranchConfirm')">取消</button>
          <button type="button" class="v52-btn-primary" id="modalBranchConfirmOk">确定</button>
        </div>
      </div>
    </div>

    <script src="../frontend/js/logger.js"></script>
    <script src="../frontend/js/icons.js"></script>
    <script src="../frontend/js/config.js"></script>
    <script src="../frontend/js/storage.js"></script>
    <script src="../frontend/js/data/issues-seed.js"></script>
    <script src="../frontend/js/seed.js"></script>
    <script src="../frontend/js/data.js"></script>
    <script src="../frontend/js/ui.js"></script>
    <script src="../frontend/js/nav.js"></script>
    <script src="../frontend/js/nav-config.js"></script>
    <script src="../frontend/js/vben/icons-bridge.js"></script>
    <script src="../frontend/js/vben-bridge.js"></script>
    <script src="../frontend/js/vben/sidebar.js"></script>
    <script src="../frontend/js/vben/header.js"></script>
    <script src="../frontend/js/vben/footer.js"></script>
    <script src="../frontend/js/vben/layout.js"></script>
    <script src="../frontend/js/layout.js"></script>
    <script src="../frontend/js/system-admin/hsf-sys-seed.js"></script>
    <script src="../frontend/js/system-admin/tztt-sys-storage.js"></script>
    <script src="../frontend/js/system-admin/core/event-bus.js"></script>
    <script src="../frontend/js/system-admin/core/filter-bar.js"></script>
    <script src="../frontend/js/components/modal.js"></script>
    <script src="../frontend/js/components/toast.js"></script>
    <script src="../frontend/js/system-admin/tztt-sys-bootstrap.js"></script>
    <script src="../frontend/js/system-admin/org-structure.js"></script>
    <script src="../frontend/js/system-admin/tztt-sys-mount.js"></script>
  </body>
</html>
