<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>操作日志 · 高标农田专项整治平台</title>
    <link rel="icon" type="image/png" href="../media/favicon.png" />
    <link rel="stylesheet" href="../frontend/css/variables.css" />
    <link rel="stylesheet" href="../frontend/css/layout.css" />
    <link rel="stylesheet" href="../frontend/css/vben-shell.css" />
    <link rel="stylesheet" href="../frontend/css/sys-components.css" />
    <link rel="stylesheet" href="../frontend/css/sys-form.css" />
    <link rel="stylesheet" href="../frontend/css/system-admin.css" />
    <link rel="stylesheet" href="../frontend/css/page-split.css" />
    <link rel="stylesheet" href="../frontend/css/pages/sys-admin/oplog-showcase.css" />
    <link rel="stylesheet" href="../frontend/css/pages/sys-admin/oplog-page.css" />
  </head>
  <body>
    <script>
      window.HSF_BASE = '../';
      window.HSF_VBEN_DEFAULT_TAG = { title: '操作日志', path: '/web/sys-logs.html' };
    </script>
    <div class="app-container">
      <vben-sidebar></vben-sidebar>
      <div class="main-wrapper">
        <vben-header></vben-header>
        <div class="content-container split-page ol-page">
          <div class="query-card collapsed" id="query-group-ol">
            <div class="query-grid">
              <div class="query-item">
                <label class="query-label" for="ol-filter-account">用户账号：</label>
                <div class="comp-wrap">
                  <input id="ol-filter-account" class="vben-input" type="text" placeholder="请输入" autocomplete="off" />
                </div>
              </div>
              <div class="query-item">
                <label class="query-label" for="ol-filter-module">操作模块：</label>
                <div class="comp-wrap">
                  <input id="ol-filter-module" class="vben-input" type="text" placeholder="请输入" autocomplete="off" />
                </div>
              </div>
              <div class="query-item is-fold">
                <label class="query-label" for="ol-filter-status">状态：</label>
                <div class="comp-wrap">
                  <select id="ol-filter-status" class="vben-input">
                    <option value="">全部</option>
                    <option value="正常">正常</option>
                    <option value="异常">异常</option>
                  </select>
                </div>
              </div>
              <div class="query-item is-fold">
                <label class="query-label" for="ol-filter-optype">操作类型：</label>
                <div class="comp-wrap">
                  <select id="ol-filter-optype" class="vben-input">
                    <option value="">全部</option>
                    <option value="create">增</option>
                    <option value="delete">删</option>
                    <option value="update">改</option>
                    <option value="query">查</option>
                    <option value="import">导入</option>
                    <option value="export">导出</option>
                  </select>
                </div>
              </div>
              <div class="query-item is-fold query-item--range" style="grid-column: span 2;">
                <label class="query-label">操作时间：</label>
                <div class="comp-wrap">
                  <div class="ol-time-range">
                    <input id="ol-filter-start" class="vben-input" type="datetime-local" step="60" />
                    <span>至</span>
                    <input id="ol-filter-end" class="vben-input" type="datetime-local" step="60" />
                  </div>
                </div>
              </div>
              <div class="query-actions">
                <button type="button" class="btn-ghost" id="ol-btn-reset">重 置</button>
                <button type="button" class="btn-primary" id="ol-btn-search">查 询</button>
                <div class="toggle-link" id="ol-toggle-btn">
                  <span class="text">展开</span>
                  <div class="arrow-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="vben-split-layout ol-mode-regular" id="ol-split">
            <div class="split-left">
              <div class="table-combined-box" id="combined-table-ol">
                <div id="section-table-header">
                  <div id="table-tools-ol">
                    <div class="tools-left-head">
                      <span class="tools-left-title">操作日志</span>
                    </div>
                    <div class="tools-right-ops">
                      <button type="button" class="tool-btn-primary" id="ol-btn-export">
                        <svg viewBox="0 0 24 24" style="width:14px;stroke:#fff;fill:none;" aria-hidden="true">
                          <path d="M12 3v12M7 8l5 5 5-5M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        导出
                      </button>
                      <div class="tool-icon-btn" id="ol-btn-toggle-query" title="搜索/隐藏查询">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                          <circle cx="11" cy="11" r="8"></circle>
                          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                      </div>
                      <div class="tool-icon-btn" id="btn-refresh" title="刷新表格">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                          <polyline points="23 4 23 10 17 10"></polyline>
                          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                      </div>
                      <div class="tool-icon-btn" id="ol-fullscreen" title="全屏查看">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                        </svg>
                      </div>
                      <div class="tool-icon-btn" id="btn-col-settings" title="列设置">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                          <circle cx="12" cy="12" r="3"></circle>
                          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                      </div>
                      <div class="col-settings-panel" id="ol-col-panel">
                        <div class="col-settings-title">可展示字段</div>
                        <div id="ol-col-list-container"></div>
                      </div>
                    </div>
                  </div>
                </div>

                <div id="section-table-body">
                  <div class="table-loading-mask" id="ol-loader">
                    <div class="spinner"></div>
                  </div>
                  <div class="fixed-table-container" id="ol-scroll-wrap">
                    <table class="vben-table-std" id="ol-main-table">
                      <thead>
                        <tr>
                          <th class="col-fixed-left" style="width:60px">
                            <div class="th-flex-container"><div class="th-title">序号</div><div class="th-divider"></div></div>
                          </th>
                          <th style="width:110px">
                            <div class="th-flex-container"><div class="th-title">账号</div><div class="th-divider"></div></div>
                          </th>
                          <th style="width:100px">
                            <div class="th-flex-container"><div class="th-title">用户名</div><div class="th-divider"></div></div>
                          </th>
                          <th style="width:110px">
                            <div class="th-flex-container"><div class="th-title">操作模块</div><div class="th-divider"></div></div>
                          </th>
                          <th style="width:120px">
                            <div class="th-flex-container"><div class="th-title">操作功能</div><div class="th-divider"></div></div>
                          </th>
                          <th style="width:180px">
                            <div class="th-flex-container"><div class="th-title">请求地址</div><div class="th-divider"></div></div>
                          </th>
                          <th style="width:90px">
                            <div class="th-flex-container"><div class="th-title">请求方式</div><div class="th-divider"></div></div>
                          </th>
                          <th style="width:90px">
                            <div class="th-flex-container"><div class="th-title">状态</div><div class="th-divider"></div></div>
                          </th>
                          <th style="width:90px">
                            <div class="th-flex-container"><div class="th-title">耗时</div><div class="th-divider"></div></div>
                          </th>
                          <th style="width:160px">
                            <div class="th-flex-container"><div class="th-title">操作时间</div><div class="th-divider"></div></div>
                          </th>
                          <th class="col-fixed-right" style="width:100px">
                            <div class="th-flex-container"><div class="th-title">操作</div></div>
                          </th>
                        </tr>
                      </thead>
                      <tbody id="ol-tbody"></tbody>
                    </table>
                  </div>
                </div>

                <div id="section-pagination">
                  <div class="vben-card" id="pagination-ol" style="padding:12px 24px; overflow:visible!important; border-top:none; border-top-left-radius:0; border-top-right-radius:0;">
                    <div class="pagi-left">
                      <span id="ol-pagi-total">共 0 条记录</span>
                      <div class="pagi-custom-select" id="ol-pagi-select-trigger">
                        <span id="ol-pagi-current-size">20条/页</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5H7z" /></svg>
                        <div class="pagi-dropdown" id="ol-pagi-dropdown">
                          <div class="pagi-option" data-val="10">10条/页</div>
                          <div class="pagi-option selected" data-val="20">20条/页</div>
                          <div class="pagi-option" data-val="50">50条/页</div>
                        </div>
                      </div>
                    </div>
                    <div class="pagi-right" id="ol-pagi-right"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <vben-footer></vben-footer>
      </div>
    </div>

    <div id="global-modal" class="modal hidden"></div>

    <div class="v52-modal-overlay" id="modalOpLogDetail" onclick="if(event.target===this)closeModal('modalOpLogDetail')">
      <div class="v52-modal-box ol-detail-modal-box" onclick="event.stopPropagation()">
        <div class="v52-modal-header">
          <div class="v52-modal-title">详情</div>
          <div class="v52-header-ops">
            <div class="v52-op-icon" onclick="closeModal('modalOpLogDetail')" title="关闭">
              <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </div>
          </div>
        </div>
        <div class="v52-modal-body ol-detail-modal-body" id="ol-detail-body"></div>
      </div>
    </div>

    <script src="../frontend/js/logger.js"></script>
    <script src="../frontend/js/icons.js"></script>
    <script src="../frontend/js/config.js"></script>
    <script src="../frontend/js/storage.js"></script>
    <script src="../frontend/js/data/issues-seed.js"></script>
    <script src="../frontend/js/seed.js"></script>
    <script src="../frontend/js/data.js"></script>
    <script src="../frontend/js/ui.js"></script>
    <script src="../frontend/js/nav.js"></script>
    <script src="../frontend/js/nav-config.js"></script>
    <script src="../frontend/js/vben/icons-bridge.js"></script>
    <script src="../frontend/js/vben-bridge.js"></script>
    <script src="../frontend/js/vben/sidebar.js"></script>
    <script src="../frontend/js/vben/header.js"></script>
    <script src="../frontend/js/vben/footer.js"></script>
    <script src="../frontend/js/vben/layout.js"></script>
    <script src="../frontend/js/layout.js"></script>
    <script src="../frontend/js/system-admin/hsf-sys-seed.js"></script>
    <script src="../frontend/js/system-admin/tztt-sys-storage.js"></script>
    <script src="../frontend/js/system-admin/core/event-bus.js"></script>
    <script src="../frontend/js/system-admin/core/ui-kit.js"></script>
    <script src="../frontend/js/components/modal.js"></script>
    <script src="../frontend/js/components/toast.js"></script>
    <script src="../frontend/js/system-admin/op-log.js"></script>
  </body>
</html>
