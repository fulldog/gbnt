<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工作台 · 高标农田专项整治平台</title>
    <link rel="icon" type="image/png" href="../media/favicon.png" />
    <link rel="stylesheet" href="../frontend/css/variables.css" />
    <link rel="stylesheet" href="../frontend/css/layout.css" />
    <link rel="stylesheet" href="../frontend/css/vben-shell.css" />
    <link rel="stylesheet" href="../frontend/css/pages/workbench.css" />
  </head>
  <body>
    <script>
      window.HSF_BASE = '../';
      window.HSF_VBEN_DEFAULT_TAG = { title: '工作台', path: '/web/workbench.html' };
    </script>
    <div class="app-container">
      <vben-sidebar></vben-sidebar>
      <div class="main-wrapper">
        <vben-header></vben-header>
        <div class="content-container" id="pageContent">

<div class="page-container wb-page">
            <div class="wb-stats" id="statGrid"></div>

            <div class="page-wrap wb-panel">
              <div class="wb-panel__toolbar">
                <div class="wb-tabs" role="tablist" aria-label="趋势视图">
                  <button type="button" class="wb-tabs__item is-active" role="tab" aria-selected="true">
                    整改趋势
                  </button>
                </div>
                <div class="vben-segmented-box" id="trendRange" role="listbox" aria-label="时间范围">
                  <div class="seg-item active" role="option" aria-selected="true" data-range="week7">近七天</div>
                  <div class="seg-item" role="option" aria-selected="false" data-range="month1">近一个月</div>
                  <div class="seg-item" role="option" aria-selected="false" data-range="halfyear">近半年</div>
                  <div class="seg-item" role="option" aria-selected="false" data-range="all">全部</div>
                </div>
              </div>
              <div class="wb-panel__body">
                <div class="wb-panel__chart">
                  <div class="wb-panel__chart-hd">
                    <h3 class="wb-panel__subhd">整改趋势</h3>
                    <div class="wb-chart-legend" aria-hidden="true">
                      <span class="wb-chart-legend__item"><i class="wb-chart-legend__dot wb-chart-legend__dot--primary"></i>上报</span>
                      <span class="wb-chart-legend__item"><i class="wb-chart-legend__dot wb-chart-legend__dot--accent"></i>完成整改</span>
                    </div>
                  </div>
                  <div id="trendChart" class="wb-chart" aria-label="整改趋势图表"></div>
                </div>
                <div class="wb-panel__rank">
                  <h3 class="wb-panel__subhd">类型整改排名</h3>
                  <div id="typeRank" class="wb-rank-list"></div>
                </div>
              </div>
            </div>

            <div class="page-wrap wb-todo">
              <div class="page-hd">
                <h2 class="page-hd__title">待办列表</h2>
              </div>
              <div class="app-table-wrap">
                <table class="app-table" id="todoTable">
                  <thead>
                    <tr>
                      <th>类型</th><th>编号</th><th>行政区划</th><th>整改人</th><th>计划完成</th><th>倒计时</th><th>状态</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
        <vben-footer></vben-footer>
      </div>
    </div>

    <script src="../frontend/js/logger.js"></script>
    <script src="../frontend/js/icons.js"></script>
    <script src="../frontend/js/config.js"></script>
    <script src="../frontend/js/storage.js"></script>
    <script src="../frontend/js/data/issues-seed.js"></script>
    <script src="../frontend/js/seed.js"></script>
    <script src="../frontend/js/data.js"></script>
    <script src="../frontend/js/ui.js"></script>
    <script src="../frontend/js/nav.js"></script>
    <script src="../frontend/js/nav-config.js"></script>
    <script src="../frontend/js/vben/icons-bridge.js"></script>
    <script src="../frontend/js/vben-bridge.js"></script>
    <script src="../frontend/js/vben/sidebar.js"></script>
    <script src="../frontend/js/vben/header.js"></script>
    <script src="../frontend/js/vben/footer.js"></script>
    <script src="../frontend/js/vben/layout.js"></script>
    <script src="../frontend/js/layout.js"></script>
    <script src="../frontend/libs/echarts/echarts.min.js"></script>
    <script src="../frontend/js/pages/workbench.js"></script>
  </body>
</html>
