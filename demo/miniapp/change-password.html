<!DOCTYPE html>
<html lang="zh-CN" class="hsf-mp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>修改密码 · 移动端</title>
    <link rel="icon" type="image/png" href="../media/favicon.png" />
    <link rel="stylesheet" href="../frontend/css/variables.css" />
    <link rel="stylesheet" href="../frontend/css/device-shell.css" />
    <link rel="stylesheet" href="../frontend/css/pages/mobile.css" />
  </head>
  <body>
    <div
      id="app-viewport"
      data-mp-status="solid"
      data-mp-title="修改密码"
      data-mp-back="./mine.html"
    >
      <div class="m-page m-pwd">
        <form class="m-pwd__form" id="mPwdForm" novalidate>
          <label class="m-pwd__field">
            <span class="m-pwd__label">旧密码</span>
            <input
              type="password"
              id="mPwdOld"
              class="m-pwd__input"
              autocomplete="current-password"
              maxlength="14"
              placeholder="请输入旧密码"
            />
          </label>
          <label class="m-pwd__field">
            <span class="m-pwd__label">新密码</span>
            <input
              type="password"
              id="mPwdNew"
              class="m-pwd__input"
              autocomplete="new-password"
              maxlength="14"
              placeholder="6～14 位"
            />
          </label>
          <label class="m-pwd__field">
            <span class="m-pwd__label">确认新密码</span>
            <input
              type="password"
              id="mPwdConfirm"
              class="m-pwd__input"
              autocomplete="new-password"
              maxlength="14"
              placeholder="再次输入新密码"
            />
          </label>
          <button type="submit" class="m-pwd__submit" id="mPwdSubmit">提交</button>
        </form>
      </div>
    </div>
    <script src="../frontend/libs/fluid-bg/fluid-bg.min.js"></script>
    <script src="../frontend/js/device-shell.js"></script>
    <script src="../frontend/js/mp-nav.js"></script>
    <script src="../frontend/js/logger.js"></script>
    <script src="../frontend/js/icons.js"></script>
    <script src="../frontend/js/config.js"></script>
    <script src="../frontend/js/storage.js"></script>
    <script src="../frontend/js/data/issues-seed.js"></script>
    <script src="../frontend/js/data/region-2023.js"></script>
    <script src="../frontend/js/seed.js"></script>
    <script src="../frontend/js/data.js"></script>
    <script src="../frontend/js/ui.js"></script>
    <script src="../frontend/js/pages/m-change-password.js"></script>
  </body>
</html>
