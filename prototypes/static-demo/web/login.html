<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · 农田专项整治平台</title>
    <link rel="icon" type="image/png" href="../media/favicon.png" />
    <link rel="stylesheet" href="../frontend/css/variables.css" />
    <link rel="stylesheet" href="../frontend/css/layout.css" />
    <link rel="stylesheet" href="../frontend/css/pages/login.css" />
  </head>
  <body class="login-body">
    <main class="login-layout">
      <section class="login-visual" aria-hidden="true"></section>
      <section class="login-panel" aria-label="管理后台登录">
        <div class="login-panel__inner">
          <header class="login-panel__brand">
            <div class="login-panel__logo">
              <img src="../media/favicon.png" alt="" width="128" height="128" />
            </div>
            <p class="login-panel__welcome">欢迎使用</p>
            <h1 class="login-panel__name" id="loginAppName">农田专项整治平台</h1>
          </header>
          <form class="login-form" id="loginForm" autocomplete="on">
            <div class="login-form__group">
              <label class="login-form__label" for="username">账号</label>
              <div class="login-form__control">
                <input
                  class="login-form__input"
                  id="username"
                  name="username"
                  autocomplete="username"
                  placeholder="请输入账号"
                  aria-label="账号"
                  required
                />
                <span class="login-form__suffix" data-icon="phone" aria-hidden="true"></span>
              </div>
            </div>
            <div class="login-form__group">
              <label class="login-form__label" for="password">密码</label>
              <div class="login-form__control">
                <input
                  class="login-form__input"
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="请输入密码"
                  aria-label="密码"
                  required
                />
                <button
                  type="button"
                  class="login-form__suffix login-form__suffix--btn"
                  id="pwdToggle"
                  aria-label="显示密码"
                  aria-pressed="false"
                >
                  <span data-icon="eyeOff" aria-hidden="true"></span>
                </button>
              </div>
            </div>
            <div class="login-form__group">
              <label class="login-form__label" for="captchaInput">验证码</label>
              <div class="login-form__control login-form__control--captcha">
                <input
                  class="login-form__input"
                  id="captchaInput"
                  name="captcha"
                  maxlength="4"
                  inputmode="numeric"
                  autocomplete="one-time-code"
                  placeholder="请输入验证码"
                  aria-label="验证码"
                  required
                />
                <button
                  type="button"
                  class="login-captcha__canvas"
                  id="captchaRefresh"
                  aria-label="刷新验证码"
                >
                  <canvas id="captchaCanvas" width="120" height="44" aria-hidden="true"></canvas>
                </button>
              </div>
            </div>
            <label class="login-remember" for="rememberPwd">
              <input type="checkbox" id="rememberPwd" class="login-remember__input" />
              <span class="login-remember__mark" aria-hidden="true"></span>
              <span class="login-remember__text">记住密码</span>
            </label>
            <button type="submit" class="login-form__submit" id="loginSubmit" aria-label="登录" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </form>
        </div>
      </section>
    </main>
    <script src="../frontend/js/logger.js"></script>
    <script src="../frontend/js/icons.js"></script>
    <script src="../frontend/js/config.js"></script>
    <script src="../frontend/js/storage.js"></script>
    <script src="../frontend/js/data/issues-seed.js"></script>
    <script src="../frontend/js/data/region-2023.js"></script>
    <script src="../frontend/js/seed.js"></script>
    <script src="../frontend/js/data.js"></script>
    <script src="../frontend/js/ui.js"></script>
    <script src="../frontend/js/pages/login.js"></script>
  </body>
</html>
