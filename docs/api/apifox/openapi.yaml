openapi: 3.0.3
info:
  title: 高标农田专项整治后台 API
  description: |
    统一信封 `{ code, data, message, cost_ms, trace_id }`，成功 `code=0`。
    鉴权 Bearer JWT。`/api/app/*` 仅 JWT、不做 RBAC。
    按当前 `apps/server` 路由与 DTO 重建。
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
    description: 本地
tags:
  - name: 健康检查
  - name: 鉴权
  - name: 附件
  - name: 工作台
  - name: 专项整改
  - name: 台账
  - name: 组织
  - name: 人员
  - name: 角色
  - name: 操作日志
  - name: 小程序
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
    LedgerQuery:
      in: query
      name: street_org_id
      schema: { type: integer, format: int64, description: 0 或省略为全部街道 }
    LedgerDateFrom:
      in: query
      name: date_from
      schema: { type: string, description: 北京时间 YYYY-MM-DD，含当日 }
    LedgerDateTo:
      in: query
      name: date_to
      schema: { type: string, description: 北京时间 YYYY-MM-DD，含当日 }
  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        data: {}
        message: { type: string, example: ok }
        cost_ms: { type: integer }
        trace_id: { type: string }
    LoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        captcha_id: { type: string, description: captcha.enabled=false 时可省略 }
        captcha: { type: string }
    AppLoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        pass_token: { type: string, description: captcha.enabled=false 时可省略 }
    ChangePasswordReq:
      type: object
      required: [old_password, new_password, confirm_password]
      properties:
        old_password: { type: string }
        new_password: { type: string, description: 长度大于 8，仅字母和数字且须同时包含 }
        confirm_password: { type: string }
    QuizBool:
      type: object
      properties:
        type: { type: string }
        value: { type: boolean }
        desc: { type: string }
        mustImg: { type: boolean }
        files:
          type: array
          items: { type: string, format: uuid }
        photos:
          type: array
          items: { $ref: "#/components/schemas/FileItem" }
    IssueInput:
      type: object
      description: |
        新建须 type、project_year、org_id、address、reporter_signature_file_id、report_user_id、type_ext。
        assignee_user 选填；0/省略新建不写、更新不改。非 0 须启用且用户组织与 org_id 互为上下级或同一节点。
        App POST /api/app/issues 服务端将 report_user_id 与 assignee_user 覆盖为当前用户。
      properties:
        type: { type: string, enum: [well, road, bridge, forest, transformer] }
        project_year: { type: integer, enum: [2020, 2021, 2022, 2023] }
        org_id: { type: integer, format: int64, description: 落点组织；新建必填且须存在；更新 0 不改 }
        code: { type: string }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        plan_date: { type: string, description: 需整改时必填 YYYY-MM-DD }
        reporter_signature_file_id: { type: string, format: uuid }
        report_user_id: { type: integer, format: int64, description: 管理端新建必填；App 忽略外部值 }
        assignee_user: { type: integer, format: int64, description: 选填，对应 issues.assignee_user }
        type_ext: { type: object, description: 含 checklist[] QuizBool }
        status: { type: string, enum: [new, pending, done], description: 仅更新 }
    RectifyInput:
      type: object
      required: [rectify_list]
      properties:
        rectify_list:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, note, file_uuids]
            properties:
              type: { type: string, description: QuizType }
              note: { type: string }
              file_uuids:
                type: array
                items: { type: string, format: uuid }
        expected_round: { type: integer, format: int64, description: 新客户端传当前 rectify_round }
    ReassignInput:
      type: object
      required: [assignee_user]
      properties:
        assignee_user: { type: integer, format: int64, description: 须启用账号 }
    ImportIssuesReq:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/IssueInput" }
    FileItem:
      type: object
      properties:
        file_id: { type: string, format: uuid }
        url: { type: string }
    OrgCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        parent_id: { type: integer, format: int64, description: 0 为根 }
        sort: { type: integer }
    OrgUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string }
    UserInput:
      type: object
      properties:
        username: { type: string }
        password: { type: string, description: 新建空则=账号且不套复杂度；有值则大于 8 位字母+数字 }
        name: { type: string }
        phone: { type: string, description: 选填；有值须为中国大陆 11 位 }
        org_id: { type: integer, format: int64 }
        role_id: { type: integer, format: int64 }
        status: { type: integer, description: 1 启用 0 停用 }
    RoleInput:
      type: object
      properties:
        name: { type: string }
        desc: { type: string }
        status: { type: integer }
    RoleAPIsInput:
      type: object
      required: [api_ids]
      properties:
        api_ids:
          type: array
          items: { type: integer, format: int64 }
paths:
  /api/health:
    get:
      tags: [健康检查]
      security: []
      summary: 健康检查
      responses:
        "200": { description: "{status:up}" }
  /api/auth/captcha:
    get:
      tags: [鉴权]
      security: []
      summary: 图形验证码
      responses:
        "200": { description: captcha_id / image_base64 }
  /api/auth/login:
    post:
      tags: [鉴权]
      security: []
      summary: 管理端登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginReq" }
      responses:
        "200": { description: JWT }
  /api/auth/me:
    get:
      tags: [鉴权]
      summary: 当前用户
      responses:
        "200": { description: 含 org_id/role_id/is_super_admin/apis }
  /api/auth/password:
    put:
      tags: [鉴权]
      summary: 本人改密
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordReq" }
      responses:
        "200": { description: ok }
  /api/auth/logout:
    post:
      tags: [鉴权]
      summary: 退出
      responses:
        "200": { description: ok }
  /api/attachments/images:
    post:
      tags: [附件]
      summary: 批量上传图片
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files: { type: array, items: { type: string, format: binary } }
                watermark: { type: string }
                lat: { type: number }
                lng: { type: number }
                address: { type: string }
      responses:
        "200": { description: data.list file_id/url }
  /api/workbench/stats:
    get:
      tags: [工作台]
      summary: 统计
      responses:
        "200": { description: total/new/pending/done/complete_rate/by_type }
  /api/workbench/trend:
    get:
      tags: [工作台]
      summary: 趋势
      parameters:
        - in: query
          name: range
          schema: { type: string, enum: [week7, month1, halfyear, all], default: week7 }
      responses:
        "200": { description: 趋势序列 }
  /api/workbench/todos:
    get:
      tags: [工作台]
      summary: 待办摘要
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200": { description: 分页待办 }
  /api/issues:
    get:
      tags: [专项整改]
      summary: 问题列表
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: project_year
          schema: { type: integer }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
      responses:
        "200": { description: list/total/page/size }
    post:
      tags: [专项整改]
      summary: 新建问题
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200": { description: 问题明细 }
  /api/issues/import:
    post:
      tags: [专项整改]
      summary: 批量导入
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportIssuesReq" }
      responses:
        "200": { description: imported }
  /api/issues/options/orgs:
    get:
      tags: [专项整改]
      summary: 组织候选
      responses:
        "200": { description: 组织列表 }
  /api/issues/options/reporters:
    get:
      tags: [专项整改]
      summary: 上报人候选
      parameters:
        - in: query
          name: org_id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
        - in: query
          name: selected_id
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: list/total/selected }
  /api/issues/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [专项整改]
      summary: 问题详情
      responses:
        "200": { description: 明细 }
    put:
      tags: [专项整改]
      summary: 更新问题
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200": { description: 明细 }
    delete:
      tags: [专项整改]
      summary: 软删
      responses:
        "200": { description: ok }
  /api/issues/{id}/assignee-options:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [专项整改]
      summary: 责任人候选
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
        - in: query
          name: selected_id
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: 同组织启用人员 }
  /api/issues/{id}/rectify:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [专项整改]
      summary: 提交整改
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RectifyInput" }
      responses:
        "200": { description: 明细 }
  /api/issues/{id}/re-rectify:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [专项整改]
      summary: 重新整改
      responses:
        "200": { description: 明细 }
  /api/issues/{id}/reassign:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [专项整改]
      summary: 重新指派
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReassignInput" }
      responses:
        "200": { description: 明细 }
  /api/ledger/street:
    get:
      tags: [台账]
      summary: 街道台账聚合
      parameters:
        - $ref: "#/components/parameters/LedgerQuery"
        - $ref: "#/components/parameters/LedgerDateFrom"
        - $ref: "#/components/parameters/LedgerDateTo"
      responses:
        "200": { description: 按组织+类型 }
  /api/ledger/street/report:
    get:
      tags: [台账]
      summary: 街道建设项目表
      parameters:
        - $ref: "#/components/parameters/LedgerQuery"
        - $ref: "#/components/parameters/LedgerDateFrom"
        - $ref: "#/components/parameters/LedgerDateTo"
      responses:
        "200": { description: 报表 }
  /api/ledger/street/rows:
    get:
      tags: [台账]
      summary: 街道台账拆分行
      parameters:
        - $ref: "#/components/parameters/LedgerQuery"
        - $ref: "#/components/parameters/LedgerDateFrom"
        - $ref: "#/components/parameters/LedgerDateTo"
      responses:
        "200": { description: 行 }
  /api/ledger/street/statistics:
    get:
      tags: [台账]
      summary: 街道台账拆分统计
      parameters:
        - $ref: "#/components/parameters/LedgerQuery"
        - $ref: "#/components/parameters/LedgerDateFrom"
        - $ref: "#/components/parameters/LedgerDateTo"
      responses:
        "200": { description: 统计 }
  /api/ledger/street/options/orgs:
    get:
      tags: [台账]
      summary: 街道组织候选
      responses:
        "200": { description: 仅街道 }
  /api/ledger/survey:
    get:
      tags: [台账]
      summary: 排查汇总
      parameters:
        - $ref: "#/components/parameters/LedgerQuery"
        - $ref: "#/components/parameters/LedgerDateFrom"
        - $ref: "#/components/parameters/LedgerDateTo"
      responses:
        "200": { description: 按类型 }
  /api/ledger/survey/report:
    get:
      tags: [台账]
      summary: 村级排查表
      parameters:
        - $ref: "#/components/parameters/LedgerQuery"
        - $ref: "#/components/parameters/LedgerDateFrom"
        - $ref: "#/components/parameters/LedgerDateTo"
      responses:
        "200": { description: 报表 }
  /api/ledger/survey/rows:
    get:
      tags: [台账]
      summary: 排查拆分行
      parameters:
        - $ref: "#/components/parameters/LedgerQuery"
        - $ref: "#/components/parameters/LedgerDateFrom"
        - $ref: "#/components/parameters/LedgerDateTo"
      responses:
        "200": { description: 行 }
  /api/ledger/survey/statistics:
    get:
      tags: [台账]
      summary: 排查拆分统计
      parameters:
        - $ref: "#/components/parameters/LedgerQuery"
        - $ref: "#/components/parameters/LedgerDateFrom"
        - $ref: "#/components/parameters/LedgerDateTo"
      responses:
        "200": { description: 统计 }
  /api/ledger/survey/options/orgs:
    get:
      tags: [台账]
      summary: 排查汇总街道候选
      responses:
        "200": { description: 仅街道 }
  /api/sys/orgs:
    get:
      tags: [组织]
      summary: 组织列表
      responses:
        "200": { description: 扁平列表 }
    post:
      tags: [组织]
      summary: 新增组织
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgCreate" }
      responses:
        "200": { description: 组织 }
  /api/sys/orgs/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [组织]
      summary: 改组织名
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgUpdate" }
      responses:
        "200": { description: 组织 }
    delete:
      tags: [组织]
      summary: 删除组织
      responses:
        "200": { description: ok }
  /api/sys/users:
    get:
      tags: [人员]
      summary: 人员列表
      parameters:
        - in: query
          name: org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
      responses:
        "200": { description: list/total }
    post:
      tags: [人员]
      summary: 新增人员
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200": { description: 用户 }
  /api/sys/users/by-org:
    get:
      tags: [人员]
      summary: 按组织列人员
      parameters:
        - in: query
          name: org_id
          schema: { type: integer, format: int64 }
      responses:
        "200": { description: list/total }
  /api/sys/users/export:
    get:
      tags: [人员]
      summary: 导出 xlsx
      parameters:
        - in: query
          name: org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: keyword
          schema: { type: string }
      responses:
        "200": { description: 文件流 }
  /api/sys/users/import:
    post:
      tags: [人员]
      summary: 导入 xlsx
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: imported }
  /api/sys/users/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [人员]
      summary: 更新人员
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200": { description: 用户 }
    delete:
      tags: [人员]
      summary: 删除人员
      responses:
        "200": { description: ok }
  /api/sys/users/{id}/reset-password:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      tags: [人员]
      summary: 重置密码为账号
      responses:
        "200": { description: ok }
  /api/sys/roles:
    get:
      tags: [角色]
      summary: 角色列表
      responses:
        "200": { description: 列表 }
    post:
      tags: [角色]
      summary: 新增角色
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200": { description: 角色 }
  /api/sys/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [角色]
      summary: 更新角色
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200": { description: 角色 }
    delete:
      tags: [角色]
      summary: 删除角色
      responses:
        "200": { description: ok }
  /api/sys/roles/{id}/apis:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [角色]
      summary: 角色授权 API
      responses:
        "200": { description: api_ids }
    put:
      tags: [角色]
      summary: 覆盖角色授权
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleAPIsInput" }
      responses:
        "200": { description: ok }
  /api/sys/apis:
    get:
      tags: [角色]
      summary: API 目录
      responses:
        "200": { description: 列表 }
  /api/sys/op-logs:
    get:
      tags: [操作日志]
      summary: 操作日志
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
      responses:
        "200": { description: list/total }
  /api/app/auth/slider/start:
    post:
      tags: [小程序]
      security: []
      summary: 滑动开始
      responses:
        "200": { description: slider_id }
  /api/app/auth/slider/finish:
    post:
      tags: [小程序]
      security: []
      summary: 滑动完成
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slider_id, duration_ms]
              properties:
                slider_id: { type: string }
                duration_ms: { type: integer, format: int64 }
      responses:
        "200": { description: pass_token }
  /api/app/auth/login:
    post:
      tags: [小程序]
      security: []
      summary: 小程序登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppLoginReq" }
      responses:
        "200": { description: JWT }
  /api/app/auth/me:
    get:
      tags: [小程序]
      summary: 当前用户
      responses:
        "200": { description: 含 org_path }
  /api/app/auth/password:
    put:
      tags: [小程序]
      summary: 改密
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordReq" }
      responses:
        "200": { description: ok }
  /api/app/auth/logout:
    post:
      tags: [小程序]
      summary: 退出
      responses:
        "200": { description: ok }
  /api/app/todos:
    get:
      tags: [小程序]
