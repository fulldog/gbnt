openapi: 3.0.3
info:
  title: 高标农田专项整治后台 API
  description: |
    Go 1.27 · Gin + Zap + MySQL + JWT。
    统一响应：`{ code, data, message, cost_ms, trace_id }`，成功 `code=0`。
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: 健康检查
  - name: 鉴权
  - name: 工作台
  - name: 专项整改
  - name: 台账
  - name: 组织
  - name: 人员
  - name: 角色
  - name: 字典
  - name: 操作日志
  - name: 附件
  - name: 小程序
    description: 小程序端独立 API（/api/app）；附件直传 POST /api/attachments/images
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        data: {}
        message: { type: string, example: ok }
        cost_ms: { type: integer, example: 12 }
        trace_id: { type: string }
    LoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: "123456" }
        captcha_id: { type: string, description: Web 图形验证码会话 ID；captcha.enabled=false 时可省略 }
        captcha: { type: string, description: 图形验证码答案；captcha.enabled=false 时可省略 }
    AppLoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: "123456" }
        pass_token: { type: string, description: 滑动验证一次性令牌；captcha.enabled=false 时可省略 }
    SliderFinishReq:
      type: object
      required: [slider_id, duration_ms]
      properties:
        slider_id: { type: string }
        duration_ms: { type: integer, description: 滑动耗时毫秒，须在配置区间内 }
    IssueInput:
      type: object
      properties:
        type: { type: string, enum: [well, road, bridge, forest, transformer] }
        street: { type: string }
        village: { type: string }
        project_name: { type: string }
        code: { type: string }
        location_text: { type: string }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        description: { type: string }
        measures: { type: string }
        plan_date: { type: string, example: "2026-09-01" }
        reporter_name: { type: string }
        reporter_phone: { type: string }
        assignee_name: { type: string }
        assignee_phone: { type: string }
        file_uuids:
          type: array
          description: 上传接口返回的 file_id 列表（字段名沿用 file_uuids；新建必填；修改且 photo_ref_uuid 为空时必填）
          items: { type: string, format: uuid }
        photo_ref_uuid:
          type: string
          description: 修改时有值=附件不变；为空则用 file_uuids 重新关联
        type_ext: { type: object }
    FileItem:
      type: object
      properties:
        file_id: { type: string, format: uuid }
        url: { type: string, example: "/uploads/2026/08/24/photo_1_1724512345678.jpg" }
    AttachImageForm:
      type: object
      description: multipart 表单；上报人姓名由服务端从 JWT 读取，无需传 user_name
      properties:
        files:
          type: array
          items: { type: string, format: binary }
          description: 多图字段名 files；单图可用 file
        lat: { type: number, example: 36.4489 }
        lng: { type: number, example: 115.982 }
        address: { type: string, example: 程麻新村西排灌沟桥 }
    Org:
      type: object
      properties:
        parent_id: { type: integer, format: int64 }
        name: { type: string }
        sort: { type: integer }
    UserInput:
      type: object
      properties:
        username: { type: string }
        password: { type: string }
        name: { type: string }
        phone: { type: string }
        org_id: { type: integer, format: int64 }
        role_id: { type: integer, format: int64 }
        status: { type: integer }
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      tags: [健康检查]
      summary: 健康检查
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/captcha:
    get:
      tags: [鉴权]
      summary: 获取图形验证码
      description: 返回 captcha_id 与 PNG base64（含 data URI 前缀）。公开接口。
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/login:
    post:
      tags: [鉴权]
      summary: 登录
      description: 账号密码 + 图形验证码（captcha.enabled=false 时可省略验证码字段）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginReq" }
      responses:
        "200":
          description: 返回 token 与用户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/me:
    get:
      tags: [鉴权]
      summary: 当前用户
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/workbench/stats:
    get:
      tags: [工作台]
      summary: 工作台统计
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues:
    get:
      tags: [专项整改]
      summary: 问题列表
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [pending, done] }
        - in: query
          name: street
          schema: { type: string }
        - in: query
          name: village
          schema: { type: string }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [专项整改]
      summary: 新增问题（提交即待整改）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/{id}:
    get:
      tags: [专项整改]
      summary: 问题详情
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    put:
      tags: [专项整改]
      summary: 更新问题
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [专项整改]
      summary: 删除问题
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/{id}/rectify:
    post:
      tags: [专项整改]
      summary: 提交整改结果
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
                file_uuids:
                  type: array
                  items: { type: string }
                rectify_photo_ref_uuid:
                  type: string
                  description: 有值=不变；空则用 file_uuids 重新关联
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/import:
    post:
      tags: [专项整改]
      summary: 批量导入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  items: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/ledger/street:
    get:
      tags: [台账]
      summary: 街道台账聚合
      parameters:
        - in: query
          name: street
          schema: { type: string }
        - in: query
          name: date_from
          schema: { type: string, example: "2026-01-01" }
        - in: query
          name: date_to
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/ledger/survey:
    get:
      tags: [台账]
      summary: 街道排查汇总
      parameters:
        - in: query
          name: street
          schema: { type: string }
        - in: query
          name: date_from
          schema: { type: string }
        - in: query
          name: date_to
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/orgs:
    get:
      tags: [组织]
      summary: 组织列表
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [组织]
      summary: 新增组织
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Org" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/orgs/{id}:
    put:
      tags: [组织]
      summary: 更新组织
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Org" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [组织]
      summary: 删除组织
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/users:
    get:
      tags: [人员]
      summary: 人员列表
      parameters:
        - in: query
          name: org_id
          schema: { type: string }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [人员]
      summary: 新增人员
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/users/{id}:
    put:
      tags: [人员]
      summary: 更新人员
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [人员]
      summary: 删除人员
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/roles:
    get:
      tags: [角色]
      summary: 角色列表
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [角色]
      summary: 新增角色
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                desc: { type: string }
                status: { type: integer, description: "1启用 0禁用" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/roles/{id}:
    put:
      tags: [角色]
      summary: 更新角色（id=1 不可编辑）
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                desc: { type: string }
                status: { type: integer, description: "1启用 0禁用" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [角色]
      summary: 删除角色（id=1 不可删）
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/roles/{id}/apis:
    get:
      tags: [角色]
      summary: 角色 API 权限（path id 为 role_id）
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok；超管 role_id=1 时 data.api_ids 为 "*"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    put:
      tags: [角色]
      summary: 覆盖角色 API 权限
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/apis:
    get:
      tags: [角色]
      summary: API 目录列表（供授权 UI）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/dict/types:
    get:
      tags: [字典]
      summary: 字典类型
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/dict/fields:
    get:
      tags: [字典]
      summary: 字典字段
      parameters:
        - in: query
          name: type_code
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/dict/items:
    get:
      tags: [字典]
      summary: 字典选项
      parameters:
        - in: query
          name: field_id
          schema: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [字典]
      summary: 新增选项
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                field_id: { type: integer }
                label: { type: string }
                value: { type: string }
                sort: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/dict/items/{id}:
    put:
      tags: [字典]
      summary: 更新选项
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                value: { type: string }
                sort: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [字典]
      summary: 删除选项
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/op-logs:
    get:
      tags: [操作日志]
      summary: 操作日志列表
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/attachments/images:
    post:
      tags: [附件]
      summary: 批量直传图片（逐张打水印）
      description: |
        当前唯一附件 HTTP 接口。分片 init/chunk/complete、bind、download 等未实现。
        静态访问返回的 url（/uploads/...）。一次最多 20 张。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AttachImageForm"
      responses:
        "200":
          description: data.list = FileItem[]（file_id + url）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  # ---------- 小程序 /api/app ----------
  /api/app/auth/slider/start:
    post:
      tags: [小程序]
      summary: 开始滑动验证
      description: 返回 slider_id。公开接口。
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/slider/finish:
    post:
      tags: [小程序]
      summary: 完成滑动验证
      description: 校验 duration_ms 后签发一次性 pass_token。公开接口。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SliderFinishReq" }
      responses:
        "200":
          description: 返回 pass_token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/login:
    post:
      tags: [小程序]
      summary: 小程序登录
      description: 账密 + pass_token（captcha.enabled=false 时可省略 pass_token）。签发与管理端同一套 JWT。公开接口。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppLoginReq" }
      responses:
        "200":
          description: 返回 token 与用户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/me:
    get:
      tags: [小程序]
      summary: 当前用户
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/todos:
    get:
      tags: [小程序]
      summary: 待办列表
      description: |
        未传 status 时默认 pending；传 status=all 表示不限状态。
        筛选对齐 miniapp/todo：type / street / village / keyword / page / size。
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          description: pending|done|all；省略则 pending
          schema: { type: string }
        - in: query
          name: street
          schema: { type: string }
        - in: query
          name: village
          schema: { type: string }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: data.list / total / page / size / status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/regions:
    get:
      tags: [小程序]
      summary: 组织树
      description: 按 sys_orgs.parent_id 嵌套 children，供上报/待办区划选择。
      responses:
        "200":
          description: data.list = [{id,name,parent_id,sort,children:[...]}]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues:
    post:
      tags: [小程序]
      summary: 上报问题
      description: 提交即待整改；先 POST /api/attachments/images 取 file_id，再传 file_uuids → photo_ref_uuid。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          description: 新建问题（含 photos）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues/{id}:
    get:
      tags: [小程序]
      summary: 问题详情
      description: 含 lat/lng，issue-map 可复用定位字段。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues/{id}/rectify:
    post:
      tags: [小程序]
      summary: 提交整改
      description: 页内整改闭环；规则同管理端（file_uuids / rectify_photo_ref_uuid）。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
                file_uuids:
                  type: array
                  items: { type: string, format: uuid }
                rectify_photo_ref_uuid:
                  type: string
                  description: 有值=附件不变；为空则用 file_uuids 重新关联
      responses:
        "200":
          description: 整改后问题（含 rectify_photos）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/mine/stats:
    get:
      tags: [小程序]
      summary: 我的概览数量
      description: |
        reported=本人上报数；pending/done=本人上报或整改责任人同名。
      responses:
        "200":
          description: "{ reported, pending, done }"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/mine/issues:
    get:
      tags: [小程序]
      summary: 我的清单
      parameters:
        - in: query
          name: scope
          required: true
          schema: { type: string, enum: [reported, pending, done] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: data.list / total / page / size / scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
