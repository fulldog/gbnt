openapi: 3.0.3
info:
  title: 高标农田专项整治后台 API
  description: |
    Go 1.27 · Gin + Zap + MySQL + JWT。
    统一响应：`{ code, data, message, cost_ms, trace_id }`，成功 `code=0`。
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: 健康检查
  - name: 鉴权
  - name: 工作台
  - name: 专项整改
  - name: 台账
  - name: 组织
  - name: 人员
  - name: 角色
  - name: 操作日志
  - name: 附件
  - name: 小程序
    description: 小程序端独立 API（/api/app）；附件直传 POST /api/attachments/images
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        data: {}
        message: { type: string, example: ok }
        cost_ms: { type: integer, example: 12 }
        trace_id: { type: string }
    LoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: "123456" }
        captcha_id: { type: string, description: Web 图形验证码会话 ID；captcha.enabled=false 时可省略 }
        captcha: { type: string, description: 图形验证码答案；captcha.enabled=false 时可省略 }
    AppLoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: "123456" }
        pass_token: { type: string, description: 滑动验证一次性令牌；captcha.enabled=false 时可省略 }
    SliderFinishReq:
      type: object
      required: [slider_id, duration_ms]
      properties:
        slider_id: { type: string }
        duration_ms: { type: integer, description: 滑动耗时毫秒，须在配置区间内 }
    IssueInput:
      type: object
      description: |
        上报/新增/更新问题。新建必填对齐 demo/miniapp/report.html：
        type、street、village、project_name、description、address 或 location_text、
        measures、plan_date、assignee_name、assignee_phone、file_uuids、type_ext。
        type_ext 按 type 使用对应扩展对象；是/否题为 boolean（true=是，false=否）。
      properties:
        type: { type: string, enum: [well, road, bridge, forest, transformer], description: 问题类型 }
        street: { type: string, description: 街道（区划） }
        village: { type: string, description: 村/社区（区划） }
        project_name: { type: string, description: 项目名称 }
        code: { type: string, description: 设施编号（选填） }
        location_text: { type: string, description: 位置描述；与 address 至少填一项 }
        address: { type: string, description: 定位地址；与 location_text 至少填一项 }
        lat: { type: number, description: 纬度 }
        lng: { type: number, description: 经度 }
        description: { type: string, description: 问题描述 }
        measures: { type: string, description: 整改措施 }
        plan_date: { type: string, example: "2026-09-01", description: 计划整改完成日 YYYY-MM-DD }
        reporter_name: { type: string, description: 上报人姓名；空则用登录用户 }
        reporter_phone: { type: string, description: 上报人电话（选填） }
        assignee_name: { type: string, description: 整改责任人 }
        assignee_phone: { type: string, description: 整改责任人电话 }
        file_uuids:
          type: array
          description: 现场照片 file_id 列表（字段名沿用 file_uuids；新建必填；修改且 photo_ref_uuid 为空时必填）
          items: { type: string, format: uuid }
        photo_ref_uuid:
          type: string
          description: 修改时有值=附件不变；为空则用 file_uuids 重新关联
        type_ext:
          description: 类型专有字段，随 type 选择 WellExt / RoadExt / BridgeExt / ForestExt / TransformerExt
          oneOf:
            - $ref: "#/components/schemas/WellExt"
            - $ref: "#/components/schemas/RoadExt"
            - $ref: "#/components/schemas/BridgeExt"
            - $ref: "#/components/schemas/ForestExt"
            - $ref: "#/components/schemas/TransformerExt"
        status: { type: string, enum: [pending, done], description: 仅更新用；新建忽略，固定 pending }
    WellExt:
      type: object
      required: [build_kind, water_out, pipe_ok, wiring_ok, box_ok, cover_ok, outlet_total, outlet_damaged, casing_total, casing_damaged]
      properties:
        build_kind: { type: string, enum: [new, match], description: 新建/配套 }
        water_out: { type: boolean, description: 机井是否出水（≥5分钟） }
        pipe_ok: { type: boolean, description: 管道是否按要求连接 }
        wiring_ok: { type: boolean, description: 走线是否规范 }
        box_ok: { type: boolean, description: 配电箱是否完好 }
        cover_ok: { type: boolean, description: 井台、井盖是否完整 }
        outlet_total: { type: integer, minimum: 0, description: 出水口总数 }
        outlet_damaged: { type: integer, minimum: 0, description: 出水口损坏数量 }
        casing_total: { type: integer, minimum: 0, description: 护筒总数 }
        casing_damaged: { type: integer, minimum: 0, description: 护筒损坏数量 }
        keeper_name: { type: string, description: 井长及分管负责人（选填） }
        keeper_phone: { type: string, description: 联系电话（选填） }
    RoadExt:
      type: object
      required: [length, width, thickness, has_shoulder, has_ash, tree_survive]
      properties:
        length: { type: number, minimum: 0, description: 长度（千米） }
        width: { type: number, minimum: 0, description: 宽度（米） }
        thickness: { type: number, minimum: 0, description: 厚度（米） }
        has_shoulder: { type: boolean, description: 是否有路肩 }
        has_ash: { type: boolean, description: 是否有灰土层 }
        tree_survive: { type: number, minimum: 0, description: 林网存活数量（棵） }
        keeper_name: { type: string, description: 负责人（选填） }
        keeper_phone: { type: string, description: 电话（选填） }
    BridgeExt:
      type: object
      required: [kind, length, width]
      properties:
        kind: { type: string, enum: [bridge, culvert, gate], description: 设施类型 桥/涵/闸 }
        length: { type: number, minimum: 0, description: 长度（米） }
        width: { type: number, minimum: 0, description: 宽度（米） }
        keeper_name: { type: string, description: 负责人（选填） }
        keeper_phone: { type: string, description: 电话（选填） }
    ForestExt:
      type: object
      required: [handover_count, existing_count, survive_rate, broken_belt, dead_trees, pest]
      properties:
        handover_count: { type: number, minimum: 0, description: 移交株数 }
        existing_count: { type: number, minimum: 0, description: 现有株数 }
        survive_rate: { type: number, minimum: 0, maximum: 100, description: 存活率 % }
        broken_belt: { type: boolean, description: 林带是否断带 }
        dead_trees: { type: boolean, description: 是否有枯死木 }
        pest: { type: boolean, description: 是否发现病虫害 }
        keeper_name: { type: string, description: 负责人（选填） }
        keeper_phone: { type: string, description: 电话（选填） }
    TransformerExt:
      type: object
      required: [capacity, voltage, powered, device_ok, cabinet_ok, illegal_wire]
      properties:
        capacity: { type: number, minimum: 0, description: 容量（kVA） }
        model: { type: string, description: 型号（选填） }
        voltage: { type: string, enum: [10kv, 0.4kv], description: 电压等级 }
        powered: { type: boolean, description: 是否通电 }
        device_ok: { type: boolean, description: 设备是否完好 }
        cabinet_ok: { type: boolean, description: 配电设施是否完好 }
        illegal_wire: { type: boolean, description: 是否私拉乱接 }
        keeper_name: { type: string, description: 负责人（选填） }
        keeper_phone: { type: string, description: 电话（选填） }
    RectifyInput:
      type: object
      properties:
        note: { type: string, description: 整改说明 }
        file_uuids:
          type: array
          description: 整改照片 file_id；rectify_photo_ref_uuid 为空时必填
          items: { type: string, format: uuid }
        rectify_photo_ref_uuid:
          type: string
          description: 有值=整改附件不变；为空则用 file_uuids 重新关联
    FileItem:
      type: object
      properties:
        file_id: { type: string, format: uuid }
        url: { type: string, example: "/uploads/2026/08/24/photo_1_1724512345678.jpg" }
    AttachImageForm:
      type: object
      description: multipart 表单；上报人姓名由服务端从 JWT 读取，无需传 user_name
      properties:
        files:
          type: array
          items: { type: string, format: binary }
          description: 多图字段名 files；单图可用 file
        watermark:
          type: string
          description: 是否烧录水印；1/true/yes/on 或 0/false/no/off；省略默认打水印
          example: "1"
        lat: { type: number, example: 36.4489, description: 纬度（仅 watermark 开启时写入水印） }
        lng: { type: number, example: 115.982, description: 经度（仅 watermark 开启时写入水印） }
        address: { type: string, example: 程麻新村西排灌沟桥, description: 地址（仅 watermark 开启时写入水印） }
    Org:
      type: object
      description: 创建/更新组织
      properties:
        name: { type: string, description: 组织名称（必填） }
        parent_id: { type: integer, format: int64, description: 上级组织 ID，根为 0 }
        sort: { type: integer, description: 排序号，越小越靠前 }
    RoleInput:
      type: object
      description: 创建/更新角色
      properties:
        name: { type: string, description: 角色名称 }
        desc: { type: string, description: 角色说明 }
        status: { type: integer, description: 1 启用 / 0 禁用；新建为 0 时默认 1 }
    RoleAPIsInput:
      type: object
      required: [api_ids]
      properties:
        api_ids:
          type: array
          description: 覆盖授权的 API 主键列表
          items: { type: integer, format: int64 }
    ImportIssuesReq:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          description: 导入行，校验规则同新建 IssueInput
          items: { $ref: "#/components/schemas/IssueInput" }
    UserInput:
      type: object
      properties:
        username: { type: string, description: 登录账号（新建必填） }
        password: { type: string, description: 明文密码（新建必填；更新时空则不改） }
        name: { type: string, description: 姓名 }
        phone: { type: string, description: 手机号 }
        org_id: { type: integer, format: int64, description: 所属组织 ID }
        role_id: { type: integer, format: int64, description: 角色 ID }
        status: { type: integer, description: 1 启用 / 0 禁用；空则新建默认 1 }
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      tags: [健康检查]
      summary: 健康检查
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/captcha:
    get:
      tags: [鉴权]
      summary: 获取图形验证码
      description: 返回 captcha_id 与 PNG base64（含 data URI 前缀）。公开接口。
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/login:
    post:
      tags: [鉴权]
      summary: 登录
      description: 账号密码 + 图形验证码（captcha.enabled=false 时可省略验证码字段）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginReq" }
      responses:
        "200":
          description: 返回 token 与用户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/me:
    get:
      tags: [鉴权]
      summary: 当前用户
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/workbench/stats:
    get:
      tags: [工作台]
      summary: 工作台统计
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues:
    get:
      tags: [专项整改]
      summary: 问题列表
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [pending, done] }
        - in: query
          name: street
          schema: { type: string }
        - in: query
          name: village
          schema: { type: string }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [专项整改]
      summary: 新增问题（提交即待整改）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/{id}:
    get:
      tags: [专项整改]
      summary: 问题详情
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    put:
      tags: [专项整改]
      summary: 更新问题
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [专项整改]
      summary: 删除问题
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/{id}/rectify:
    post:
      tags: [专项整改]
      summary: 提交整改结果
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RectifyInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/import:
    post:
      tags: [专项整改]
      summary: 批量导入
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportIssuesReq" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/ledger/street:
    get:
      tags: [台账]
      summary: 街道台账聚合
      parameters:
        - in: query
          name: street
          schema: { type: string }
        - in: query
          name: date_from
          schema: { type: string, example: "2026-01-01" }
        - in: query
          name: date_to
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/ledger/survey:
    get:
      tags: [台账]
      summary: 街道排查汇总
      parameters:
        - in: query
          name: street
          schema: { type: string }
        - in: query
          name: date_from
          schema: { type: string }
        - in: query
          name: date_to
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/orgs:
    get:
      tags: [组织]
      summary: 组织列表
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [组织]
      summary: 新增组织
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Org" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/orgs/{id}:
    put:
      tags: [组织]
      summary: 更新组织
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Org" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [组织]
      summary: 删除组织
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/users:
    get:
      tags: [人员]
      summary: 人员列表
      parameters:
        - in: query
          name: org_id
          schema: { type: string }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [人员]
      summary: 新增人员
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/users/{id}:
    put:
      tags: [人员]
      summary: 更新人员
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [人员]
      summary: 删除人员
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/roles:
    get:
      tags: [角色]
      summary: 角色列表
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [角色]
      summary: 新增角色
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/roles/{id}:
    put:
      tags: [角色]
      summary: 更新角色（id=1 不可编辑）
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [角色]
      summary: 删除角色（id=1 不可删）
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/roles/{id}/apis:
    get:
      tags: [角色]
      summary: 角色 API 权限（path id 为 role_id）
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok；超管 role_id=1 时 data.api_ids 为 "*"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    put:
      tags: [角色]
      summary: 覆盖角色 API 权限
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleAPIsInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/apis:
    get:
      tags: [角色]
      summary: API 目录列表（供授权 UI）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/op-logs:
    get:
      tags: [操作日志]
      summary: 操作日志列表
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
        - in: query
          name: size
          schema: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/attachments/images:
    post:
      tags: [附件]
      summary: 批量直传图片（可选水印）
      description: |
        当前唯一附件 HTTP 接口。分片 init/chunk/complete、bind、download 等未实现。
        表单 watermark=1|0 控制是否烧录水印（省略默认打水印）。静态访问返回的 url（/uploads/...）。一次最多 20 张。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AttachImageForm"
      responses:
        "200":
          description: data.list = FileItem[]（file_id + url）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  # ---------- 小程序 /api/app ----------
  /api/app/auth/slider/start:
    post:
      tags: [小程序]
      summary: 开始滑动验证
      description: 返回 slider_id。公开接口。
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/slider/finish:
    post:
      tags: [小程序]
      summary: 完成滑动验证
      description: 校验 duration_ms 后签发一次性 pass_token。公开接口。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SliderFinishReq" }
      responses:
        "200":
          description: 返回 pass_token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/login:
    post:
      tags: [小程序]
      summary: 小程序登录
      description: 账密 + pass_token（captcha.enabled=false 时可省略 pass_token）。签发与管理端同一套 JWT。公开接口。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppLoginReq" }
      responses:
        "200":
          description: 返回 token 与用户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/me:
    get:
      tags: [小程序]
      summary: 当前用户
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/todos:
    get:
      tags: [小程序]
      summary: 待办列表
      description: |
        未传 status 时默认 pending；传 status=all 表示不限状态。
        筛选对齐 miniapp/todo：type / street / village / keyword / page / size。
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          description: pending|done|all；省略则 pending
          schema: { type: string }
        - in: query
          name: street
          schema: { type: string }
        - in: query
          name: village
          schema: { type: string }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: data.list / total / page / size / status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/regions:
    get:
      tags: [小程序]
      summary: 组织树
      description: 按 sys_orgs.parent_id 嵌套 children，供上报/待办区划选择。
      responses:
        "200":
          description: data.list = [{id,name,parent_id,sort,children:[...]}]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues:
    post:
      tags: [小程序]
      summary: 上报问题
      description: 提交即待整改；先 POST /api/attachments/images 取 file_id，再传 file_uuids → photo_ref_uuid。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          description: 新建问题（含 photos）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues/{id}:
    get:
      tags: [小程序]
      summary: 问题详情
      description: 含 lat/lng，issue-map 可复用定位字段。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues/{id}/rectify:
    post:
      tags: [小程序]
      summary: 提交整改
      description: 页内整改闭环；规则同管理端（file_uuids / rectify_photo_ref_uuid）。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RectifyInput" }
      responses:
        "200":
          description: 整改后问题（含 rectify_photos）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/mine/stats:
    get:
      tags: [小程序]
      summary: 我的概览数量
      description: |
        reported=本人上报数；pending/done=本人上报或整改责任人同名。
      responses:
        "200":
          description: "{ reported, pending, done }"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/mine/issues:
    get:
      tags: [小程序]
      summary: 我的清单
      parameters:
        - in: query
          name: scope
          required: true
          schema: { type: string, enum: [reported, pending, done] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: data.list / total / page / size / scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
