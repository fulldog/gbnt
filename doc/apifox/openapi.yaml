openapi: 3.0.3
info:
  title: 高标农田专项整治后台 API
  description: |
    Go 1.27 · Gin + Zap + MySQL + JWT。
    统一响应：`{ code, data, message, cost_ms, trace_id }`，成功 `code=0`。
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发
tags:
  - name: 健康检查
  - name: 鉴权
  - name: 工作台
  - name: 专项整改
  - name: 台账
  - name: 组织
  - name: 人员
  - name: 角色
  - name: 操作日志
  - name: 附件
  - name: 小程序
    description: 小程序端独立 API（/api/app）；附件直传 POST /api/attachments/images
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        data: {}
        message: { type: string, example: ok }
        cost_ms: { type: integer, example: 12 }
        trace_id: { type: string }
    LoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: "admin" }
        captcha_id: { type: string, description: Web 图形验证码会话 ID；captcha.enabled=false 时可省略 }
        captcha: { type: string, description: 图形验证码答案；captcha.enabled=false 时可省略 }
    AppLoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, example: "admin" }
        pass_token: { type: string, description: 滑动验证一次性令牌；captcha.enabled=false 时可省略 }
    SliderFinishReq:
      type: object
      required: [slider_id, duration_ms]
      properties:
        slider_id: { type: string }
        duration_ms: { type: integer, description: 滑动耗时毫秒，须在配置区间内 }
    IssueInput:
      type: object
      description: |
        上报/新增/更新问题。新建核心：type、project_year、四级区划 ID（至少一级）、
        address、reporter_signature_file_id、type_ext（checklist 为 QuizBool 数组）。
        QuizBool 按答题推导 needs_rectify：无问题 status=done，有问题 status=new。
        有问题时 plan_date 必填。assignee_user 接口不传，库内可空由服务端后续填充。
      properties:
        type: { type: string, enum: [well, road, bridge, forest, transformer], description: 问题类型 }
        project_year: { type: integer, enum: [2020, 2021, 2022, 2023], description: 项目年度 }
        root_org_id: { type: integer, format: int64, description: 区划根组织 ID（可空） }
        district_org_id: { type: integer, format: int64, description: 区划区级组织 ID（可空） }
        street_org_id: { type: integer, format: int64, description: 区划街道组织 ID（可空） }
        village_org_id: { type: integer, format: int64, description: 区划村级组织 ID（可空） }
        code: { type: string, description: 设施编号（选填） }
        address: { type: string, description: 定位地址（必填） }
        lat: { type: number, description: 纬度 }
        lng: { type: number, description: 经度 }
        plan_date: { type: string, example: "2026-09-01", description: 计划整改完成日；需整改时必填 }
        reporter_signature_file_id: { type: string, format: uuid, description: 排查电子签名 file_id }
        type_ext:
          description: 类型专有字段；是/否题在 checklist
          oneOf:
            - $ref: "#/components/schemas/WellExt"
            - $ref: "#/components/schemas/RoadExt"
            - $ref: "#/components/schemas/BridgeExt"
            - $ref: "#/components/schemas/ForestExt"
            - $ref: "#/components/schemas/TransformerExt"
        status: { type: string, enum: [new, pending, done], description: 仅更新用；新建由 quiz 推导 }
    QuizBool:
      type: object
      required: [type, value]
      description: 是/否排查项；放在 type_ext.checklist；导致需整改时 desc 必填；mustImg=true 时 files 长度须 >0；回显含 photos
      properties:
        type:
          type: string
          description: 排查项类型；须属于当前问题类型允许的枚举且不重复
          enum:
            - water_out
            - pipe_ok
            - wiring_ok
            - box_ok
            - cover_ok
            - transformer_ok
            - has_shoulder
            - has_ash
            - needs_rectify
            - broken_belt
            - dead_trees
            - pest
            - powered
            - device_ok
            - cabinet_ok
            - illegal_wire
        value: { type: boolean, description: 是=true / 否=false }
        desc: { type: string, description: 说明（异常时必填） }
        mustImg: { type: boolean, description: 是否必填现场照片；true 时 files 长度须 >0 }
        files:
          type: array
          description: 现场照片 file_id 列表；mustImg=true 时必填
          items: { type: string, format: uuid }
        photos:
          type: array
          description: 回显；入参忽略
          items: { $ref: "#/components/schemas/FileItem" }
    WellExt:
      type: object
      required: [build_kind, checklist, outlet_total, outlet_damaged, casing_total, casing_damaged]
      properties:
        build_kind: { type: string, enum: [new, match], description: 新建/配套 }
        checklist:
          type: array
          description: 须含 water_out/pipe_ok/wiring_ok/box_ok/cover_ok/transformer_ok 各一条
          items: { $ref: "#/components/schemas/QuizBool" }
        outlet_total: { type: integer, minimum: 0, description: 出水口总数 }
        outlet_damaged: { type: integer, minimum: 0, description: 出水口损坏数量 }
        casing_total: { type: integer, minimum: 0, description: 护筒总数 }
        casing_damaged: { type: integer, minimum: 0, description: 护筒损坏数量 }
        keeper_name: { type: string, description: 井长及分管负责人（选填） }
        keeper_phone: { type: string, description: 联系电话（选填） }
    RoadExt:
      type: object
      required: [length, width, thickness, checklist, tree_survive]
      properties:
        length: { type: number, minimum: 0, description: 长度（千米） }
        width: { type: number, minimum: 0, description: 宽度（米） }
        thickness: { type: number, minimum: 0, description: 厚度（米） }
        checklist:
          type: array
          description: 须含 has_shoulder、has_ash 各一条
          items: { $ref: "#/components/schemas/QuizBool" }
        tree_survive: { type: number, minimum: 0, description: 林网存活数量（棵） }
        keeper_name: { type: string, description: 负责人（选填） }
        keeper_phone: { type: string, description: 电话（选填） }
    BridgeExt:
      type: object
      required: [kind, length, width, checklist]
      properties:
        kind: { type: string, enum: [bridge, culvert, gate], description: 设施类型 桥/涵/闸 }
        length: { type: number, minimum: 0, description: 长度（米） }
        width: { type: number, minimum: 0, description: 宽度（米） }
        checklist:
          type: array
          description: 须含 needs_rectify 一条
          items: { $ref: "#/components/schemas/QuizBool" }
        keeper_name: { type: string, description: 负责人（选填） }
        keeper_phone: { type: string, description: 电话（选填） }
    ForestExt:
      type: object
      required: [handover_count, existing_count, survive_rate, checklist]
      properties:
        handover_count: { type: number, minimum: 0, description: 移交株数 }
        existing_count: { type: number, minimum: 0, description: 现有株数 }
        survive_rate: { type: number, minimum: 0, maximum: 100, description: 存活率 % }
        checklist:
          type: array
          description: 须含 broken_belt、dead_trees、pest 各一条
          items: { $ref: "#/components/schemas/QuizBool" }
        keeper_name: { type: string, description: 负责人（选填） }
        keeper_phone: { type: string, description: 电话（选填） }
    TransformerExt:
      type: object
      required: [capacity, voltage, checklist]
      properties:
        capacity: { type: number, minimum: 0, description: 容量（kVA） }
        model: { type: string, description: 型号（选填） }
        voltage: { type: string, enum: [10kv, 0.4kv], description: 电压等级 }
        checklist:
          type: array
          description: 须含 powered、device_ok、cabinet_ok、illegal_wire 各一条
          items: { $ref: "#/components/schemas/QuizBool" }
        keeper_name: { type: string, description: 负责人（选填） }
        keeper_phone: { type: string, description: 电话（选填） }
    RectifyInput:
      type: object
      required: [rectify_list]
      properties:
        rectify_list:
          type: array
          minItems: 1
          description: 分项整改；同一 type 可重复；对照 checklist 需整改项覆盖齐全则 done 否则 pending
          items:
            type: object
            required: [type, note, file_uuids]
            properties:
              type:
                type: string
                description: 整改项 QuizType（与 checklist 项 type 对应）
              note:
                type: string
                description: 该项整改说明（必填）
              file_uuids:
                type: array
                description: 该项整改照片 file_id 列表
                items: { type: string, format: uuid }
    ReassignInput:
      type: object
      required: [assignee_user]
      properties:
        assignee_user:
          type: integer
          format: int64
          description: 整改责任人用户 ID（必填，须为启用账号）
    FileItem:
      type: object
      properties:
        file_id: { type: string, format: uuid }
        url: { type: string, example: "/uploads/2026/08/24/photo_1_1724512345678.jpg" }
    AttachImageForm:
      type: object
      description: multipart 表单；上报人姓名由服务端从 JWT 读取，无需传 user_name
      properties:
        files:
          type: array
          items: { type: string, format: binary }
          description: 多图字段名 files；单图可用 file
        watermark:
          type: string
          description: 是否烧录水印；1/true/yes/on 或 0/false/no/off；省略默认打水印
          example: "1"
        lat: { type: number, example: 36.4489, description: 纬度（仅 watermark 开启时写入水印） }
        lng: { type: number, example: 115.982, description: 经度（仅 watermark 开启时写入水印） }
        address: { type: string, example: 程麻新村西排灌沟桥, description: 地址（仅 watermark 开启时写入水印） }
    Org:
      type: object
      description: 新增组织。parent_id=0 创建根；否则类型由上级逐级推导
      required: [name]
      properties:
        name: { type: string, description: 组织名称（必填） }
        parent_id: { type: integer, format: int64, description: 上级组织 ID；0 或不传表示新增根节点 }
        sort: { type: integer, description: 排序号；省略或 0 则追加到同级末尾 }
    OrgUpdate:
      type: object
      description: 编辑组织（仅名称）
      required: [name]
      properties:
        name: { type: string, description: 组织名称（必填） }
    RoleInput:
      type: object
      description: 创建/更新角色
      properties:
        name: { type: string, description: 角色名称 }
        desc: { type: string, description: 角色说明 }
        status: { type: integer, description: 1 启用 / 0 禁用；新建为 0 时默认 1 }
    RoleAPIsInput:
      type: object
      required: [api_ids]
      properties:
        api_ids:
          type: array
          description: 覆盖授权的 API 主键列表
          items: { type: integer, format: int64 }
    ImportIssuesReq:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          description: 导入行，校验规则同新建 IssueInput
          items: { $ref: "#/components/schemas/IssueInput" }
    UserInput:
      type: object
      properties:
        username: { type: string, description: 登录账号（新建必填） }
        password: { type: string, description: 明文密码（新建空则=账户名；更新时空则不改） }
        name: { type: string, description: 姓名 }
        phone: { type: string, description: 手机号 }
        org_id: { type: integer, format: int64, description: 所属组织 ID }
        role_id: { type: integer, format: int64, description: 角色 ID }
        status: { type: integer, description: 1 启用 / 0 禁用；空则新建默认 1 }
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      tags: [健康检查]
      summary: 健康检查
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/captcha:
    get:
      tags: [鉴权]
      summary: 获取图形验证码
      description: 返回 captcha_id 与 PNG base64（含 data URI 前缀）。公开接口。
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/login:
    post:
      tags: [鉴权]
      summary: 登录
      description: 账号密码 + 图形验证码（captcha.enabled=false 时可省略验证码字段）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginReq" }
      responses:
        "200":
          description: 返回 token 与用户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/me:
    get:
      tags: [鉴权]
      summary: 当前用户
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/password:
    put:
      tags: [鉴权]
      summary: 本人修改密码
      description: JWT 即可，不做 RBAC。body old_password / new_password / confirm_password。新密码 6–14 位、须同时含字母与数字（区分大小写）。成功后递增 token_ver，旧 token 全部失效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password, confirm_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 6, maxLength: 14, description: 字母+数字组合，区分大小写 }
                confirm_password: { type: string, description: 须与 new_password 一致 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/logout:
    post:
      tags: [鉴权]
      summary: 退出登录
      description: JWT 即可，不做 RBAC。将当前 token 的 jti 加入黑名单至该 token 过期。
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/workbench/stats:
    get:
      tags: [工作台]
      summary: 工作台统计
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues:
    get:
      tags: [专项整改]
      summary: 问题列表
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [new, pending, done, all] }
        - in: query
          name: street
          schema: { type: string }
        - in: query
          name: village
          schema: { type: string }
        - in: query
          name: root_org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: district_org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: street_org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: village_org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: project_year
          schema: { type: integer, enum: [2020, 2021, 2022, 2023] }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [专项整改]
      summary: 新增问题（按 quiz 推导 new/done）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/{id}:
    get:
      tags: [专项整改]
      summary: 问题详情
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: type_ext 含 photos；rectify_records[].photos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    put:
      tags: [专项整改]
      summary: 更新问题
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [专项整改]
      summary: 删除问题
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/{id}/rectify:
    post:
      tags: [专项整改]
      summary: 提交整改结果
      description: |
        仅 status∈{new,pending}；body 为 rectify_list[]（type/note/file_uuids，type 可重复）。
        覆盖判定：Need=上报 checklist 中需整改的 QuizType；Covered=历史 quiz_type∪本次 type；Need⊆Covered → done，否则 pending。
        写入 assignee_user=当前用户。Need 为空则提交后 done。管理端不校验认领互斥。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RectifyInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/{id}/re-rectify:
    post:
      tags: [专项整改]
      summary: 重新整改
      description: 仅 done 且仍有需整改 QuizType → pending；保留历史整改记录（累计覆盖）；不改 assignee_user
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/{id}/reassign:
    post:
      tags: [专项整改]
      summary: 重新指派整改人
      description: 仅管理端。body assignee_user 须为启用用户；只更新认领人，不改 status、不删整改记录。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReassignInput" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/import:
    post:
      tags: [专项整改]
      summary: 批量导入
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportIssuesReq" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/ledger/street:
    get:
      tags: [台账]
      summary: 街道台账聚合
      parameters:
        - in: query
          name: street_org_id
          schema: { type: integer, format: int64 }
          description: 街道组织 ID；0 或不传则不限
        - in: query
          name: date_from
          schema: { type: string, example: "2026-01-01" }
        - in: query
          name: date_to
          schema: { type: string }
      responses:
        "200":
          description: rows 按 village_org_id + type 分组
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/ledger/survey:
    get:
      tags: [台账]
      summary: 街道排查汇总
      parameters:
        - in: query
          name: street_org_id
          schema: { type: integer, format: int64 }
          description: 街道组织 ID；0 或不传则不限
        - in: query
          name: date_from
          schema: { type: string }
        - in: query
          name: date_to
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/orgs:
    get:
      tags: [组织]
      summary: 组织列表
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [组织]
      summary: 新增组织
      description: |
        - `parent_id=0`（或不传）：创建根节点 `root`
        - 指定上级：按 root→district→street→village 逐级推导类型
        - 村为末级，不可再向下新增
      requestBody:
