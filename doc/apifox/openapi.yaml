openapi: 3.0.3
info:
  title: 高标农田专项整治后台 API
  description: |
    统一信封 `{ code, data, message, cost_ms, trace_id }`，成功 `code=0`。
    鉴权 Bearer JWT。`/api/app/*` 仅 JWT、不做 RBAC。
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
    description: 本地
tags:
  - name: 健康检查
  - name: 鉴权
  - name: 附件
  - name: 工作台
  - name: 专项整改
  - name: 台账
  - name: 组织
  - name: 人员
  - name: 角色
  - name: 操作日志
  - name: 小程序
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer, example: 0 }
        data: {}
        message: { type: string, example: ok }
        cost_ms: { type: integer }
        trace_id: { type: string }
    LoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        captcha_id: { type: string, description: captcha.enabled=false 时可省略 }
        captcha: { type: string }
    AppLoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        pass_token: { type: string, description: captcha.enabled=false 时可省略 }
    ChangePasswordReq:
      type: object
      required: [old_password, new_password, confirm_password]
      properties:
        old_password: { type: string }
        new_password: { type: string, minLength: 6, maxLength: 14, description: 字母+数字 }
        confirm_password: { type: string }
    QuizBool:
      type: object
      properties:
        type: { type: string }
        value: { type: boolean }
        desc: { type: string }
        mustImg: { type: boolean }
        files:
          type: array
          items: { type: string, format: uuid }
        photos:
          type: array
          items: { $ref: "#/components/schemas/FileItem" }
    IssueInput:
      type: object
      description: 新建须 type、project_year、org_id、address、reporter_signature_file_id、type_ext
      properties:
        type: { type: string, enum: [well, road, bridge, forest, transformer] }
        project_year: { type: integer, enum: [2020, 2021, 2022, 2023] }
        org_id: { type: integer, format: int64, description: 落点组织；新建必填且须存在；更新 0 不改 }
        code: { type: string }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        plan_date: { type: string, description: 需整改时必填 YYYY-MM-DD }
        reporter_signature_file_id: { type: string, format: uuid }
        type_ext: { type: object, description: 含 checklist[] QuizBool }
        status: { type: string, enum: [new, pending, done], description: 仅更新 }
    RectifyInput:
      type: object
      required: [rectify_list]
      properties:
        rectify_list:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, note, file_uuids]
            properties:
              type: { type: string, description: QuizType }
              note: { type: string }
              file_uuids:
                type: array
                items: { type: string, format: uuid }
    ReassignInput:
      type: object
      required: [assignee_user]
      properties:
        assignee_user: { type: integer, format: int64 }
    ImportIssuesReq:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/IssueInput" }
    FileItem:
      type: object
      properties:
        file_id: { type: string, format: uuid }
        url: { type: string }
    OrgCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        parent_id: { type: integer, format: int64, description: 0 为根 }
        sort: { type: integer }
    OrgUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string }
    UserInput:
      type: object
      properties:
        username: { type: string }
        password: { type: string, description: 新建空则=账号；更新空则不改 }
        name: { type: string }
        phone: { type: string }
        org_id: { type: integer, format: int64 }
        role_id: { type: integer, format: int64 }
        status: { type: integer, description: 1 启用 0 停用 }
    RoleInput:
      type: object
      properties:
        name: { type: string }
        desc: { type: string }
        status: { type: integer }
    RoleAPIsInput:
      type: object
      required: [api_ids]
      properties:
        api_ids:
          type: array
          items: { type: integer, format: int64 }
paths:
  /api/health:
    get:
      tags: [健康检查]
      security: []
      summary: 健康检查
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/captcha:
    get:
      tags: [鉴权]
      security: []
      summary: 图形验证码
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/login:
    post:
      tags: [鉴权]
      security: []
      summary: 管理端登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginReq" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/me:
    get:
      tags: [鉴权]
      summary: 当前用户
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/password:
    put:
      tags: [鉴权]
      summary: 本人改密
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordReq" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/auth/logout:
    post:
      tags: [鉴权]
      summary: 退出登录
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/attachments/images:
    post:
      tags: [附件]
      summary: 批量上传图片
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files: { type: array, items: { type: string, format: binary } }
                watermark: { type: string, description: 省略/真打水印；0 原图 }
                lat: { type: number }
                lng: { type: number }
                address: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/workbench/stats:
    get:
      tags: [工作台]
      summary: 工作台统计
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues:
    get:
      tags: [专项整改]
      summary: 问题列表
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [new, pending, done, all] }
        - in: query
          name: org_id
          schema: { type: integer, format: int64 }
          description: >0 含该组织及下级
        - in: query
          name: project_year
          schema: { type: integer }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [专项整改]
      summary: 新增问题
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/import:
    post:
      tags: [专项整改]
      summary: 批量导入问题
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportIssuesReq" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [专项整改]
      summary: 问题详情
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    put:
      tags: [专项整改]
      summary: 更新问题
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [专项整改]
      summary: 删除问题
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/{id}/rectify:
    post:
      tags: [专项整改]
      summary: 提交整改
      description: Need⊆Covered → done 否则 pending；写入 assignee_user。管理端不校验认领。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RectifyInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/{id}/re-rectify:
    post:
      tags: [专项整改]
      summary: 重新整改
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/issues/{id}/reassign:
    post:
      tags: [专项整改]
      summary: 重新指派整改人
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReassignInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/ledger/street:
    get:
      tags: [台账]
      summary: 街道台账
      parameters:
        - in: query
          name: street_org_id
          schema: { type: integer, format: int64 }
          description: >0 含子树
        - in: query
          name: date_from
          schema: { type: string }
        - in: query
          name: date_to
          schema: { type: string }
      responses:
        "200":
          description: rows 按 org_id+type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/ledger/survey:
    get:
      tags: [台账]
      summary: 排查汇总
      parameters:
        - in: query
          name: street_org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: date_from
          schema: { type: string }
        - in: query
          name: date_to
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/orgs:
    get:
      tags: [组织]
      summary: 组织列表
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [组织]
      summary: 新增组织
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgCreate" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/orgs/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [组织]
      summary: 更新组织名称
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgUpdate" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [组织]
      summary: 删除组织
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/users:
    get:
      tags: [人员]
      summary: 用户列表
      parameters:
        - in: query
          name: org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [人员]
      summary: 新增用户
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/users/export:
    get:
      tags: [人员]
      summary: 导出 xlsx
      parameters:
        - in: query
          name: org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: keyword
          schema: { type: string }
      responses:
        "200":
          description: users.xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /api/sys/users/import:
    post:
      tags: [人员]
      summary: 导入 xlsx（仅新增）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/users/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [人员]
      summary: 更新用户
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [人员]
      summary: 删除用户
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/users/{id}/reset-password:
    post:
      tags: [人员]
      summary: 重置密码
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/roles:
    get:
      tags: [角色]
      summary: 角色列表
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    post:
      tags: [角色]
      summary: 新增角色
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      tags: [角色]
      summary: 更新角色
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    delete:
      tags: [角色]
      summary: 删除角色
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/roles/{id}/apis:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [角色]
      summary: 角色 API 权限
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
    put:
      tags: [角色]
      summary: 设置角色 API
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleAPIsInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/apis:
    get:
      tags: [角色]
      summary: API 目录
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/sys/op-logs:
    get:
      tags: [操作日志]
      summary: 操作日志
      parameters:
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/slider/start:
    post:
      tags: [小程序]
      security: []
      summary: 开始滑动验证
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/slider/finish:
    post:
      tags: [小程序]
      security: []
      summary: 完成滑动
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slider_id, duration_ms]
              properties:
                slider_id: { type: string }
                duration_ms: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/login:
    post:
      tags: [小程序]
      security: []
      summary: 小程序登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppLoginReq" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/me:
    get:
      tags: [小程序]
      summary: 当前用户
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/password:
    put:
      tags: [小程序]
      summary: 改密
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordReq" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/logout:
    post:
      tags: [小程序]
      summary: 退出
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/todos:
    get:
      tags: [小程序]
      summary: 待办
      description: status 空或 all 查全部，排序 new>pending>done。用户组织子树 ∩ query org_id 子树。
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: project_year
          schema: { type: integer }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/regions:
    get:
      tags: [小程序]
      summary: 组织树
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues:
    post:
      tags: [小程序]
      summary: 上报
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues/{id}:
    get:
      tags: [小程序]
      summary: 问题详情
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues/{id}/rectify:
    post:
      tags: [小程序]
      summary: 整改（认领互斥）
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RectifyInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues/{id}/re-rectify:
    post:
      tags: [小程序]
      summary: 重新整改（认领互斥）
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/mine/stats:
    get:
      tags: [小程序]
      summary: 我的概览
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
