  # ---------- 小程序 /api/app ----------
  /api/app/auth/slider/start:
    post:
      tags: [小程序]
      summary: 开始滑动验证
      description: 返回 slider_id。公开接口。
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/slider/finish:
    post:
      tags: [小程序]
      summary: 完成滑动验证
      description: 校验 duration_ms 后签发一次性 pass_token。公开接口。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SliderFinishReq" }
      responses:
        "200":
          description: 返回 pass_token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/login:
    post:
      tags: [小程序]
      summary: 小程序登录
      description: 账密 + pass_token（captcha.enabled=false 时可省略 pass_token）。签发与管理端同一套 JWT。公开接口。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppLoginReq" }
      responses:
        "200":
          description: 返回 token 与用户信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/me:
    get:
      tags: [小程序]
      summary: 当前用户
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/password:
    put:
      tags: [小程序]
      summary: 本人修改密码
      description: 规则同 PUT /api/auth/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password, confirm_password]
              properties:
                old_password: { type: string }
                new_password: { type: string, minLength: 6, maxLength: 14, description: 字母+数字组合，区分大小写 }
                confirm_password: { type: string, description: 须与 new_password 一致 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/auth/logout:
    post:
      tags: [小程序]
      summary: 退出登录
      description: 规则同 POST /api/auth/logout
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/todos:
    get:
      tags: [小程序]
      summary: 待办列表
      description: |
        status 空或 all 表示不限状态；结果按 new > pending > done 排序（同状态 id 降序）。
        组织范围：当前用户 OrgID 及其下属；问题落点为最细非 0 的区划 ID（村→街道→区→根）；OrgID=0 不加组织过滤。
        筛选：type / status / *_org_id / project_year / keyword / page / size。
      parameters:
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: status
          description: new|pending|done|all；省略或空表示全部，按 new>pending>done 排序
          schema: { type: string }
        - in: query
          name: root_org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: district_org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: street_org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: village_org_id
          schema: { type: integer, format: int64 }
        - in: query
          name: project_year
          schema: { type: integer }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: data.list / total / page / size / status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/regions:
    get:
      tags: [小程序]
      summary: 组织树
      description: 按 sys_orgs.parent_id 嵌套 children（含 type），供上报/待办区划选择。
      responses:
        "200":
          description: data.list = [{id,name,type,parent_id,sort,children:[...]}]
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues:
    post:
      tags: [小程序]
      summary: 上报问题
      description: 按 quiz 推导 needs_rectify 与 status（new/done）；先上传附件再写入 type_ext.checklist[].files。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueInput" }
      responses:
        "200":
          description: 新建问题（type_ext 含 photos）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues/{id}:
    get:
      tags: [小程序]
      summary: 问题详情
      description: 含 lat/lng、rectify_records（含 photos）；issue-map 可复用定位字段。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues/{id}/rectify:
    post:
      tags: [小程序]
      summary: 提交整改
      description: |
        页内整改；规则同管理端覆盖判定。
        认领互斥：assignee_user>0 且不等于当前用户 → 400「该问题已由他人认领整改」。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RectifyInput" }
      responses:
        "200":
          description: 整改后问题（rectify_records 含 photos）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/issues/{id}/re-rectify:
    post:
      tags: [小程序]
      summary: 重新整改
      description: |
        done 且仍有需整改 QuizType → pending；保留历史记录。
        认领互斥同 rectify；不改 assignee_user。
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/mine/stats:
    get:
      tags: [小程序]
      summary: 我的概览数量
      description: |
        reported=本人上报数；pending 对齐 status=new（待整改）；done=已整改。
        pending/done 统计范围为本人上报或整改责任人同名。
      responses:
        "200":
          description: "{ reported, pending, done }"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
  /api/app/mine/issues:
    get:
      tags: [小程序]
      summary: 我的清单
      parameters:
        - in: query
          name: scope
          required: true
          schema: { type: string, enum: [reported, pending, done] }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: data.list / total / page / size / scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }
