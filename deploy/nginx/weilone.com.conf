# gbnt 反向代理：weilone.com → 本机 8080
# 安装示例（Ubuntu/Debian）：
#   sudo cp weilone.com.conf /etc/nginx/sites-available/weilone.com
#   sudo ln -sf /etc/nginx/sites-available/weilone.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 需先确保后端已监听 127.0.0.1:8080（configs/config.yaml 中 server.addr）

upstream gbnt_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name weilone.com www.weilone.com;

    # 附件上传：单张上限见 config.yaml upload.max_file_size，此处留余量
    client_max_body_size 100m;

    access_log /var/log/nginx/weilone.com.access.log;
    error_log  /var/log/nginx/weilone.com.error.log;

    location / {
        proxy_pass http://gbnt_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
