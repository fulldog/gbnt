# gbnt 同域分流：页面 dist + /api 反代 + /uploads 读盘
#
# 安装前把下面三处改成机器真实值：
#   server_name
#   root   （管理后台构建产物，默认仓库内 apps/admin-web/dist）
#   alias  （必须与 apps/server/configs/config.yaml 的 upload.root 为同一绝对路径）
#
# 下文以仓库根 /opt/www/gbnt、域名 weilone.com 为例。
#
# Ubuntu/Debian：
#   sudo cp weilone.com.conf /etc/nginx/sites-available/weilone.com
#   sudo ln -sf /etc/nginx/sites-available/weilone.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 需先确保 Go 监听 127.0.0.1:8080（生产建议 config.yaml 中 server.addr: "127.0.0.1:8080"）
# HTTPS 示例见 docs/operations/nginx.md（默认只开 80，避免无证书时 nginx -t 失败）

upstream gbnt_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name weilone.com www.weilone.com;

    # 附件上传：单张上限见 config.yaml upload.max_file_size，此处留余量
    client_max_body_size 100m;

    access_log /var/log/nginx/weilone.com.access.log;
    error_log  /var/log/nginx/weilone.com.error.log;

    location /api/ {
        proxy_pass http://gbnt_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # 与 location 一样保留末尾 /；禁止 SPA fallback
    location /uploads/ {
        alias /opt/www/gbnt/apps/server/storage/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        root /opt/www/gbnt/apps/admin-web/dist;
        try_files $uri $uri/ /index.html;
    }
}

